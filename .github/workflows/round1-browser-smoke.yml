name: Round 1 browser smoke
on:
  pull_request:
    branches: [main]
    paths: ['browser-smoke-trigger.txt']
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Test two real guest browsers on production
        run: |
          cat > /tmp/round1-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://life-in-game-independence35.vercel.app/game/?room=ci-browser-smoke';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--disable-dev-shm-usage']});
          const errors=[];
          async function enterGuest(label){
            const context=await browser.newContext();
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push(`${label}:pageerror:${e.message}`));
            page.on('console',m=>{ if(m.type()==='error') errors.push(`${label}:console:${m.text()}`); });
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#btn-guest').click({timeout:20000});
            await page.locator('#btn-start').waitFor({state:'visible',timeout:20000});
            await page.locator('#btn-start').click();
            await page.locator('#round1-hud').waitFor({state:'visible',timeout:30000});
            const waiting=page.locator('#round1-waiting');
            if(await waiting.isVisible()) throw new Error(`${label}: false elimination banner is visible on lobby entry`);
            await page.waitForFunction(()=>{
              const b=document.querySelector('#round1-start');
              return b && !b.disabled && /Записаться/.test(b.textContent||'');
            },null,{timeout:30000});
            return {context,page};
          }
          const a=await enterGuest('A');
          const b=await enterGuest('B');
          await Promise.all([
            a.page.waitForFunction(()=>/Онлайн:\s*2/.test(document.querySelector('#players-online')?.textContent||''),null,{timeout:30000}),
            b.page.waitForFunction(()=>/Онлайн:\s*2/.test(document.querySelector('#players-online')?.textContent||''),null,{timeout:30000})
          ]);
          await a.page.locator('#round1-start').click();
          await b.page.locator('#round1-start').click();
          await Promise.all([
            a.page.waitForFunction(()=>/2\s*\/\s*2/.test(document.querySelector('#round1-counter')?.textContent||'') || /Старт через/.test(document.querySelector('#round1-status')?.textContent||''),null,{timeout:30000}),
            b.page.waitForFunction(()=>/2\s*\/\s*2/.test(document.querySelector('#round1-counter')?.textContent||'') || /Старт через/.test(document.querySelector('#round1-status')?.textContent||''),null,{timeout:30000})
          ]);
          await Promise.all([
            a.page.waitForFunction(()=>/Старт через|НАБЛЮДАТЕЛЬ/.test(document.querySelector('#round1-status')?.textContent||''),null,{timeout:30000}),
            b.page.waitForFunction(()=>/Старт через|НАБЛЮДАТЕЛЬ/.test(document.querySelector('#round1-status')?.textContent||''),null,{timeout:30000})
          ]);
          if(await a.page.locator('#round1-waiting').isVisible() || await b.page.locator('#round1-waiting').isVisible()) throw new Error('false elimination banner became visible during registration/countdown');
          console.log('A online:',await a.page.locator('#players-online').textContent());
          console.log('B online:',await b.page.locator('#players-online').textContent());
          console.log('A status:',await a.page.locator('#round1-status').textContent());
          console.log('B status:',await b.page.locator('#round1-status').textContent());
          const serious=errors.filter(x=>!x.includes('favicon')&&!x.includes('WebGL')&&!x.includes('net::ERR_BLOCKED_BY_CLIENT'));
          if(serious.length) console.log('Browser console errors:',serious.join('\n'));
          await a.context.close(); await b.context.close(); await browser.close();
          console.log('REAL TWO-GUEST PRODUCTION SMOKE PASSED');
          JS
          node /tmp/round1-smoke.mjs
