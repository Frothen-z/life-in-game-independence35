name: Apply Round 1 clean HUD v12
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - round1-cleanhud-trigger.txt
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply clean HUD patch
        run: python tools/apply_round1_clean_hud_v12.py
      - name: Verify syntax and UI invariants
        run: |
          node --check game/js/main.js
          node --check game/js/round1-game.js
          python - <<'PY'
          from pathlib import Path
          html=Path('game/index.html').read_text(encoding='utf-8')
          css=Path('game/css/style.css').read_text(encoding='utf-8')
          main=Path('game/js/main.js').read_text(encoding='utf-8')
          assert 'id="round1-rules"' in html
          assert '15 секунд' in html
          assert 'round1-cleanhud-12' in html
          assert 'ROUND1_CLEAN_HUD_V12' in css
          assert "round1Hud.classList.add('hidden')" in main
          assert "document.body.classList.add('round1-match-active')" in main
          assert "round1QuestionBoard.visible = false" in main
          assert "round1QuestionBoard.visible = phase === 'countdown'" in main
          print('Round 1 clean HUD v12 checks passed')
          PY
      - name: Commit game changes
        run: |
          git config user.name "Frothen-z"
          git config user.email "frothen234@gmail.com"
          git add game/index.html game/css/style.css game/js/main.js
          git diff --cached --stat
          if git diff --cached --quiet; then echo "No game changes"; exit 0; fi
          git commit -m "Move Round 1 rules to lobby and clear gameplay HUD"
          git push origin HEAD:main
