name: Apply playable Round 1 build

on:
  push:
    paths:
      - '.github/workflows/apply-round1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore tested Round 1 files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/round1.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/round1.b64 | tar -xzf - -C .
          rm -f .github/workflows/apply-round1.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit Round 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Frothen-z'
          git config user.email 'frothen234@gmail.com'
          git add -A
          git commit -m 'Build playable Round 1 elimination game'
          git push origin HEAD:main
