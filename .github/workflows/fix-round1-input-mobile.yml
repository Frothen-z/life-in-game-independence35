name: Fix Round 1 watcher composition
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - input-mobile-trigger.txt
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make watcher monumental and unobstructed
        run: python tools/make_round1_watcher_giant.py
      - name: Syntax and composition checks
        run: |
          node --check game/js/main.js
          python - <<'PY'
          from pathlib import Path
          main=Path('game/js/main.js').read_text(encoding='utf-8')
          assert 'round1Doll.scale.setScalar(3.55)' in main
          assert 'round1Doll.position.set(0, 0.25, 70.5)' in main
          assert 'round1QuestionBoard.position.set(12.5, 9.4, 55.5)' in main
          assert 'watcherKey = new THREE.SpotLight' in main
          assert 'watcherRim = new THREE.PointLight' in main
          print('Giant watcher composition checks passed')
          PY
      - name: Commit watcher redesign
        run: |
          git config user.name "Frothen-z"
          git config user.email "frothen234@gmail.com"
          git add game/js/main.js
          git diff --cached --stat
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Make Round 1 watcher monumental and visible"
          git push origin HEAD:main
