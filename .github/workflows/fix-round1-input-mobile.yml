name: Fix Round 1 input and mobile network
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - input-mobile-trigger.txt
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply repair
        run: |
          python tools/fix_round1_input_mobile.py
          python tools/fix_round1_cursor.py
      - name: Syntax and invariant checks
        run: |
          node --check game/js/main.js
          node --check game/js/services/peer-room.js
          node --check game/js/round1-game.js
          python - <<'PY'
          from pathlib import Path
          main=Path('game/js/main.js').read_text(encoding='utf-8')
          peer=Path('game/js/services/peer-room.js').read_text(encoding='utf-8')
          css=Path('game/css/style.css').read_text(encoding='utf-8')
          html=Path('game/index.html').read_text(encoding='utf-8')
          assert 'function syncRound1InputMode()' in main
          assert 'Peer fallback attempt' in main
          assert 'PEERJS_SOURCES' in peer and 'unpkg.com/peerjs' in peer
          assert 'stun:stun.l.google.com:19302' in peer
          assert 'body.round1-mode:not(.round1-playing)' in css
          canvas=css.split('#c {',1)[1].split('}',1)[0]
          assert 'cursor: default;' in canvas and 'cursor: none;' not in canvas
          assert 'round1-mobile-7' in html
          print('input/mobile/cursor invariants ok')
          PY
      - name: Round 1 logic checks
        run: |
          node --input-type=module <<'JS'
          import { checkpointFor, evaluateCheckpoint, createRoundState, registeredPlayerIds, isRoundParticipant } from './game/js/round1-game.js';
          const ids=registeredPlayerIds([{id:'desktop',joined:true},{id:'mobile',joined:true}]);
          if(ids.length!==2) throw new Error('queue failed');
          const state=createRoundState(ids,Date.now(),91);
          if(!isRoundParticipant(state,'desktop')||!isRoundParticipant(state,'mobile')) throw new Error('participant failed');
          for(let i=0;i<5;i++){
            const cp=checkpointFor(i,91);
            const zone=cp.zones.find(z=>z.year===cp.correctYear);
            if(!evaluateCheckpoint({x:zone.x,z:zone.z,movedDistance:0,checkpoint:cp}).pass) throw new Error('checkpoint '+i);
          }
          console.log('round1 logic ok');
          JS
      - name: Commit repaired game
        run: |
          git config user.name "Frothen-z"
          git config user.email "frothen234@gmail.com"
          git add game/js/main.js game/js/services/peer-room.js game/css/style.css game/index.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fix Round 1 cursor and mobile guest network"
          git push origin HEAD:main
