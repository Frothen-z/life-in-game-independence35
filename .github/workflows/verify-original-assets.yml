name: Verify original Life in Game assets

on:
  push:
    paths:
      - '.github/workflows/verify-original-assets.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check original hosted assets against ZIP hashes
        shell: bash
        run: |
          set -euo pipefail
          base='https://lifeingame.uz'
          check() {
            path="$1"; expected="$2"
            mkdir -p "$(dirname "$path")"
            echo "Downloading $base/$path"
            curl -fL --retry 2 --connect-timeout 15 --max-time 120 "$base/$path" -o "$path"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            echo "$path $actual"
            test "$actual" = "$expected"
          }
          check 'game/models/model.glb' '9586f1343be48fe4c3858ebfb7d004cc0571ce7d17ed0c6d3d0d6d8e81790f19'
          check 'game/models/model_idle.glb' '26d3fb568fcc6ddc3e6de3d683a3d4ee3a93f0f04761eb5386471055b1e06dba'
          check 'game/models/model_walk.glb' '9586f1343be48fe4c3858ebfb7d004cc0571ce7d17ed0c6d3d0d6d8e81790f19'
          check 'game/models/chess/board.glb' '3a2252b21c13ff98f5032958e0a459e36aab61fa1b9405311e30bea760274ee6'
          check 'game/models/city/env/lantern.glb' '9bed82346f2e6124f2e8b9ca38cc631ddb5ae438a102094628e89326dff5a935'
          check 'game/models/city/restaurant.glb' '48cf5cd9197ac49eaa9ee94269245cb70631b3680609c9f543af3051e22fd88a'
          check 'game/models/city/grass.glb' '024459eb9ea35308f2c2d7b58440c623316ab2489316302113233e013313d228'
          check 'game/assets/bg-city.jpg' '469e1d4e93dd6c2e5b356c12b26100bcf4b95ff80bb5e13af6dcd0eedac2b7f7'
