name: Round 1 desktop mobile production smoke
on:
  pull_request:
    branches: [main]
    paths:
      - desktop-mobile-smoke-trigger.txt
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Test desktop plus mobile guests on production
        run: |
          cat > round1-desktop-mobile-smoke.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const room = `ci-dm-${Date.now()}`;
          const base = `https://life-in-game-independence35.vercel.app/game/?room=${room}`;
          const browser = await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader','--disable-dev-shm-usage']});
          const consoleErrors=[];

          async function enterGuest(context,label){
            const page=await context.newPage();
            page.on('pageerror',e=>consoleErrors.push(`${label}:pageerror:${e.message}`));
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(`${label}:console:${m.text()}`); });
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>{
              const t=document.querySelector('#auth-mode')?.textContent||'';
              return t && !/Проверяем/.test(t);
            },null,{timeout:30000});
            await page.locator('#btn-guest').click({timeout:20000});
            await page.locator('#screen-character').waitFor({state:'visible',timeout:20000});
            await page.locator('#btn-start').evaluate(el=>el.click());
            await page.locator('#round1-hud').waitFor({state:'visible',timeout:30000});
            if(await page.locator('#round1-waiting').isVisible()) throw new Error(`${label}: false elimination banner`);
            await page.waitForFunction(()=>{
              const btn=document.querySelector('#round1-start');
              const online=document.querySelector('#players-online')?.textContent||'';
              return btn && !btn.disabled && /Записаться/.test(btn.textContent||'') && !/ошибка/i.test(online);
            },null,{timeout:60000});
            return page;
          }

          const desktopContext=await browser.newContext({viewport:{width:1440,height:900}});
          const mobileContext=await browser.newContext({...devices['iPhone 13']});
          const desktop=await enterGuest(desktopContext,'desktop');

          const cursorBefore=await desktop.locator('#c').evaluate(el=>getComputedStyle(el).cursor);
          if(cursorBefore==='none') throw new Error(`desktop cursor hidden in lobby: ${cursorBefore}`);
          const canvasBox=await desktop.locator('#c').boundingBox();
          if(canvasBox) await desktop.mouse.click(canvasBox.x+40, canvasBox.y+canvasBox.height-60);
          await desktop.waitForTimeout(400);
          if(await desktop.evaluate(()=>document.pointerLockElement!==null)) throw new Error('desktop pointer lock captured during lobby');
          const cursorAfter=await desktop.locator('#c').evaluate(el=>getComputedStyle(el).cursor);
          if(cursorAfter==='none') throw new Error('desktop cursor became hidden after canvas click in lobby');

          const mobile=await enterGuest(mobileContext,'mobile');
          await Promise.all([
            desktop.waitForFunction(()=>/Онлайн:\s*2/.test(document.querySelector('#players-online')?.textContent||''),null,{timeout:60000}),
            mobile.waitForFunction(()=>/Онлайн:\s*2/.test(document.querySelector('#players-online')?.textContent||''),null,{timeout:60000})
          ]);
          const mobileNet=await mobile.locator('#players-online').textContent();
          if(/ошибка/i.test(mobileNet||'')) throw new Error(`mobile network error: ${mobileNet}`);

          await desktop.locator('#round1-start').click();
          await mobile.locator('#round1-start').tap();
          await Promise.all([
            desktop.waitForFunction(()=>/2\s*\/\s*2/.test(document.querySelector('#round1-counter')?.textContent||'') || /Старт через/.test(document.querySelector('#round1-status')?.textContent||''),null,{timeout:30000}),
            mobile.waitForFunction(()=>/2\s*\/\s*2/.test(document.querySelector('#round1-counter')?.textContent||'') || /Старт через/.test(document.querySelector('#round1-status')?.textContent||''),null,{timeout:30000})
          ]);
          if(await desktop.evaluate(()=>document.pointerLockElement!==null)) throw new Error('pointer lock active during countdown');
          await Promise.all([
            desktop.waitForFunction(()=>document.body.classList.contains('round1-playing'),null,{timeout:20000}),
            mobile.waitForFunction(()=>document.body.classList.contains('round1-playing'),null,{timeout:20000})
          ]);

          console.log('desktop online:',await desktop.locator('#players-online').textContent());
          console.log('mobile online:',await mobile.locator('#players-online').textContent());
          console.log('desktop status:',await desktop.locator('#round1-status').textContent());
          console.log('mobile status:',await mobile.locator('#round1-status').textContent());
          console.log('desktop lobby cursor:',cursorBefore,'->',cursorAfter);
          const serious=consoleErrors.filter(x=>!x.includes('favicon')&&!x.includes('WebGL')&&!x.includes('ERR_BLOCKED_BY_CLIENT'));
          if(serious.length) console.log('Browser console errors:',serious.join('\n'));
          await desktopContext.close(); await mobileContext.close(); await browser.close();
          console.log('DESKTOP + MOBILE ROUND1 PRODUCTION SMOKE PASSED');
          JS
          node round1-desktop-mobile-smoke.mjs
