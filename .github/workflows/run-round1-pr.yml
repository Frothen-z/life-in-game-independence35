name: Apply tested Round 1

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'round1-final'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and verify Round 1 package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin round1-final:refs/remotes/origin/round1-final --force
          : > /tmp/round1.b64
          for i in $(seq -w 0 11); do
            git show "origin/round1-final:round1_payload/part-${i}.b64" >> /tmp/round1.b64
          done

          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          data = Path('/tmp/round1.b64').read_text().strip()
          if len(data) != 110712:
              raise SystemExit(f'Unexpected payload length: {len(data)}')
          raw = base64.b64decode(data, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          if digest != 'b49d35c7292297118fa4983d0853fcd5c741dea8f369ab44c4e61864ab43be9b':
              raise SystemExit(f'Payload SHA mismatch: {digest}')
          Path('/tmp/round1.tgz').write_bytes(raw)
          print('Round 1 package verified:', len(raw), digest)
          PY

          tar -tzf /tmp/round1.tgz
          tar -xzf /tmp/round1.tgz -C .

          node --check game/js/main.js
          node --check game/js/round1-game.js
          node --check game/js/world/city-layout.js
          grep -q "ROUND1_QUESTIONS" game/js/main.js
          grep -q "id=\"round1-hud\"" game/index.html
          grep -q "1 РАУНД" game/js/main.js

          rm -rf round1_payload
          rm -f .github/workflows/apply-round1.yml .github/workflows/run-round1-pr.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Publish Round 1 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Frothen-z'
          git config user.email 'frothen234@gmail.com'
          git add -A
          git commit -m 'Build playable Round 1 elimination game'
          git push origin HEAD:main
